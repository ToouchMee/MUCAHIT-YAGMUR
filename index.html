<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Mücahit YAĞMUR | TouchMe</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #131b2a;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --color-green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }
    .top-glow {
      position: absolute;
      top: 0; left: 0; right: 0; height: 320px;
      background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18), transparent 70%);
      pointer-events: none;
    }
    .minimal-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(145deg, #162032 0%, #101726 100%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 38px 24px 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .avatar-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 18px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    .name-title {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.25;
    }
    .role-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.35;
    }
    .buttons-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .action-btn {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }
    .action-btn:active { transform: scale(0.98); }
    .btn-call {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }
    .btn-call:hover { background-color: var(--accent-hover); }
    .btn-whatsapp {
      background-color: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
    }
    .btn-vcard {
      background-color: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-vcard:hover { background-color: #27354a; }
    .btn-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .footer-note {
      margin-top: 26px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.04em;
    }
    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background-color: #1e293b;
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast-box.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
